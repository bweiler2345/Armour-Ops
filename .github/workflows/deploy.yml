# Checks every push to main and deploys Armour Ops to Cloudflare Workers
# (workers.dev) when every check passes. Also runs on demand from the Actions
# tab ("Run workflow"). Builds run on Linux, which OpenNext supports fully.
#
# Needed in GitHub (Settings > Secrets and variables > Actions):
#   Variables: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#              (public values, inlined into the browser code at build time)
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Runtime secrets (Supabase secret key, R2) live only in Cloudflare.
# See docs/DEPLOYMENT.md.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push waits instead of racing.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests (unit and database)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Cloudflare build and secret scan
        run: npm run cf:build

      - name: Browser bundle scan
        run: |
          if grep -rlE "SUPABASE_SECRET_KEY|R2_SECRET_ACCESS_KEY|R2_ACCESS_KEY_ID|aws4fetch|r2\.cloudflarestorage" .next/static; then
            echo "Server-only code or names found in browser bundles. Not deploying."
            exit 1
          fi

      - name: Worker size (Workers Free limit)
        run: npm run cf:size

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::notice::Deployment skipped: the Cloudflare secrets or Supabase variables aren't set up yet (docs/DEPLOYMENT.md)."
            exit 0
          fi
          npx wrangler deploy --message "commit ${GITHUB_SHA::7}"

      - name: Health check
        if: github.ref == 'refs/heads/main'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::notice::Set the PRODUCTION_URL variable to check the deployed app after each deployment."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$PRODUCTION_URL/api/health" | grep -q '"status":"ok"'; then
              echo "Production is responding."
              exit 0
            fi
            sleep 10
          done
          echo "The deployed app didn't answer the health check."
          exit 1
